<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apip See </title>
    <meta
      name="description"
      content="Apip See — Personal branding and social media links."
    />
    <meta name="author" content="Apip See" />
    <meta name="theme-color" content="#000000" />
    <!-- =================================================
         FAVICON BLOCK

         Put the website favicon here:

         assets/img/favicon.png

         Recommended:
         - PNG format
         - Square image
         - 512x512px recommended
         - Simple logo or initials
    ================================================= -->
    <link rel="icon" type="image/png" href="assets/img/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Apip See — Personal Branding" />
    <meta
      property="og:description"
      content="Apip See — Personal branding and social media links."
    />
    <meta property="og:image" content="assets/img/profile.jpg" />
    <meta property="og:url" content="YOUR_GITHUB_PAGES_URL" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Apip See — Personal Branding" />
    <meta
      name="twitter:description"
      content="Apip See — Personal branding and social media links."
    />
    <meta name="twitter:image" content="assets/img/profile.jpg" />
    <!-- =================================================
         GITHUB PAGES URL BLOCK

         Replace:

         YOUR_GITHUB_PAGES_URL

         with the actual published GitHub Pages URL.

         Example format:

         https://username.github.io/repository-name/
    ================================================= -->
    <link rel="canonical" href="YOUR_GITHUB_PAGES_URL" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <main class="container">
      <section class="profile" aria-label="Profile section">
        <img
          class="profile-image"
          src="assets/img/profile.jpg"
          alt="Apip See Profile"
          loading="eager"
        />

        <h1>Apip See</h1>
      </section>

      <div class="social-wrapper">
        <!-- =================================================
             SOCIAL MEDIA LINKS

             To change a social media URL:
             1. Find the correct <a> element.
             2. Find the href="..." attribute.
             3. Replace the URL inside href.
             4. Do not remove target="_blank".
             5. Save the file.
        ================================================= -->
        <section class="social-links" aria-label="Social media links">
          <a
            class="social-button"
            href="https://www.tiktok.com/@apip_see?_r=1&_t=ZS-998VnwN2Xdh"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Apip See on TikTok"
          >
            <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
            <span>TikTok</span>
          </a>

          <a
            class="social-button"
            href="https://id.shp.ee/r84qjd7h?fromSource=copy_link&smtt=0.0.9"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Apip See on Shopee"
          >
            <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
            <span>Shopee</span>
          </a>

          <a
            class="social-button"
            href="https://www.instagram.com/apip_see?igsi=MWdwaXJvemthZ3NyNg%3D%3D&utm_source=qr"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Apip See on Instagram"
          >
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
            <span>Instagram</span>
          </a>

          <a
            class="social-button"
            href="https://www.facebook.com/ApipSee"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Apip See on Facebook"
          >
            <i class="fa-brands fa-facebook" aria-hidden="true"></i>
            <span>Facebook</span>
          </a>

          <a
            class="social-button"
            href="https://www.linkedin.com/in/apip-see-215630348?utm_source=share_via&utm_content=profile&utm_medium=member_ios"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Apip See on LinkedIn"
          >
            <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
            <span>LinkedIn</span>
          </a>

          <a
            class="social-button"
            href="https://whatsapp.com/channel/0029Vb8eyr71CYoKvcGhv90O"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Apip See WhatsApp Channel"
          >
            <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
            <span>WhatsApp Channel</span>
          </a>

          <a
            class="social-button"
            href="https://youtube.com/@apip_see?si=nrTDx19M_37WhkHU"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Apip See on YouTube"
          >
            <i class="fa-brands fa-youtube" aria-hidden="true"></i>
            <span>YouTube</span>
          </a>

          <a
            class="social-button"
            href="https://apipsee.github.io/ABOUT-ME/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Apip See About Me"
          >
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <span>About Me</span>
          </a>

          <a
            class="social-button"
            href="https://apipsee.github.io/KATALOG/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Apip See Katalog"
          >
            <i class="fa-solid fa-book-open" aria-hidden="true"></i>
            <span>Katalog</span>
          </a>
        </section>
      </div>

      <footer class="site-footer">© 2026 Apip See</footer>
    </main>

    <script src="assets/js/script.js"></script>
  </body>
</html>
